 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
	    <script>
	        let input = 'javascript'
	        let result = ' '
	        for(let i=0; i<input.length; i++){
	            for(let j=0; j<i; j++){
	                if(input[j]==input[i])
	                    result+=input[j]
	            }
	        }
	        console.log("Duplicate Characters in the given input is",result)
	    </script>
 </body>
 </html>
