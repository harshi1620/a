<!DOCTYPE html>

    <title>GitHub Repository</title>

<body>

<h2>Create a GitHub Repository</h2>

<ol>
    <li>Login to GitHub.</li>
    <li>Click <b>New Repository</b>.</li>
    <li>Enter the repository name.</li>
    <li>Click <b>Create Repository</b>.</li>
    <li>Connect your local project using Git.</li>
</ol>

<pre>
git remote add origin https://github.com/username/project.git
git push -u origin main
</pre>

</body>
</html>
