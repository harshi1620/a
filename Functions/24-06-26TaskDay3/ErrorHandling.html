<!DOCTYPE html>
<html>
<head>
    <title> Error Class</title>
</head>
<body>

    <button onclick="testError()">Test Error</button>

    <script>
        class AgeError extends Error {
            constructor(message) {
                super(message)
                this.name = "AgeError"
            }
        }

        function testError() {
            try {
                let age = 15

                if (age < 18) {
                    throw new AgeError("Age must be 18 or above.")
                }

                console.log("Eligible")
            }
            catch (error) {
                console.log(error.name + ": " + error.message)
            }
        }
    </script>

</body>
</html>
