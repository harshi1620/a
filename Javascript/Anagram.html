<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a ='saw'
        let b = 'was'
        let allchars = true
        for(let i=0; i<a.length; i++){
            isFound1 = false
            for(let j=0; j<b.length; j++){
                if(a[i]==b[j]){
                   isFound1=true
                   break 
                }
            }
            isFound2 = false
            for(let k=0; k<a.length; k++){
                if(b[i]==a[k]){
                    isFound2=true
                    break
                }
            }
            if(isFound1==false || isFound2==false){
                allchars = false
                break
            }
        }
        if(allchars && a.length == b.length){
            console.log(a,'is anagram')
        }
        else{
            console.log(a,'is not anagram')
        }
    </script>
</body>
</html>
