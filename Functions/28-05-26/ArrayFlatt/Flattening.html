<!DOCTYPE html>
<html>
<head>
    <title>Flatten Array</title>
</head>
<body>

<h2>Flatten Array</h2>

<p id="output"></p>

<script>
    let arr = [1, 2, [3, 4], [5, 6]]

    let flatArr = arr.flat()

    document.getElementById("output").innerHTML =
        "Flattened Array: " + flatArr
</script>

</body>
</html>
