<!DOCTYPE html>
<html>
<head>
    <title>Flexbox and Grid</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        /* Flexbox Navigation */
        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#333;
            color:white;
            padding:15px;
        }

        nav ul{
            display:flex;
            list-style:none;
        }

        nav ul li{
            margin-left:20px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
        }

        nav ul li a:hover{
            color:yellow;
        }

        /* Grid Layout */
        .container{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
            padding:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 5px gray;
        }

        .card:hover{
            background:lightblue;
        }

        /* Responsive Design */
        @media(max-width:768px){

            nav{
                flex-direction:column;
            }

            nav ul{
                flex-direction:column;
                margin-top:10px;
            }

            nav ul li{
                margin:10px 0;
            }

            .container{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <h2>My Website</h2>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<div class="container">

    <div class="card">
        <h3>HTML</h3>
        <p>Learn webpage structure.</p>
    </div>

    <div class="card">
        <h3>CSS</h3>
        <p>Style your webpages.</p>
    </div>

    <div class="card">
        <h3>JavaScript</h3>
        <p>Add interactivity.</p>
    </div>

    <div class="card">
        <h3>Bootstrap</h3>
        <p>Create responsive websites.</p>
    </div>

    <div class="card">
        <h3>React</h3>
        <p>Build modern web apps.</p>
    </div>

    <div class="card">
        <h3>Node.js</h3>
        <p>Develop backend applications.</p>
    </div>

</div>

</body>
</html>
