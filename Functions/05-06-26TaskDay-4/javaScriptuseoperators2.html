<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    

    <h2>JavaScript Operators Programs</h2>

    <script>
        // Arithmetic Operators
        let a = 101
        let b = 5

        document.write("<h3>Arithmetic Operators</h3>")
        document.write("Addition: " + (a + b) + "<br>")
        document.write("Subtraction: " + (a - b) + "<br>")
        document.write("Multiplication: " + (a * b) + "<br>")
        document.write("Division: " + (a / b) + "<br><br>")

        // Comparison Operator:-
        // document.write("<h3>Comparison Operators</h3>")
        document.write("a > b : " + (a > b) + "<br>")
        document.write("a < b : " + (a < b) + "<br>")
        document.write("a == b : " + (a == b) + "<br><br>")

        // Logical Operator:--
        let x = true
        let y = false

        // document.write("<h3>Logical Operators</h3>")
        document.write("x && y : " + (x && y) + "<br>")
        document.write("x || y : " + (x || y) + "<br>")
        document.write("!x : " + (!x) + "<br><br>")

        //  Assignment Operator:--
        let num = 10
        num += 5

        // document.write("<h3>Assignment Operator</h3>")
        document.write("num += 5 : " + num + "<br><br>")

        //  Increment / Decrement:--
        let count = 5
        count++

        // document.write("<h3>Increment Operator</h3>")
        document.write("count++ : " + count + "<br>")

        count--

        // document.write("<h3>Decrement Operator</h3>")
        document.write("count-- : " + count + "<br><br>")

        // Ternary Operator:--
        let age = 18

        let result = (age >= 18) ? "Eligible to vote" : "Not eligible"

        // document.write("<h3>Ternary Operator</h3>")
        document.write(result)
            </script>
            
 
</body>
</html>
