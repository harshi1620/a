<!DOCTYPE html>
<html>
<head>
    <title>Simple Webpage Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Grid Container */
        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "nav nav"
                "sidebar main"
                "footer footer";
            grid-template-columns: 200px 1fr;
            gap: 10px;
            padding: 10px;
        }

        /* Sections */
        .header {
            grid-area: header;
            background: skyblue;
            padding: 20px;
            text-align: center;
        }

        .nav {
            grid-area: nav;
            background: orange;
            padding: 15px;
            text-align: center;
        }

        .sidebar {
            grid-area: sidebar;
            background: lightgreen;
            padding: 20px;
        }

        .main {
            grid-area: main;
            background: lightgray;
            padding: 20px;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .card {
            background: white;
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        }

        .footer {
            grid-area: footer;
            background: gray;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                grid-template-areas:
                    "header"
                    "nav"
                    "sidebar"
                    "main"
                    "footer";
                grid-template-columns: 1fr;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">Header</div>

    <div class="nav">Navigation Bar</div>

    <div class="sidebar">
        <h3>Sidebar</h3>
        <p>Menu 1</p>
        <p>Menu 2</p>
        <p>Menu 3</p>
    </div>

    <div class="main">
        <h2>Main Content</h2>

        <div class="cards">
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
        </div>
    </div>

    <div class="footer">Footer</div>

</div>

</body>
</html>
