    <script>
        let arr =[1,2,3,2,4,5,1]
        let duplicate =[]

        for (let i=0;i<arr.length;i++){
            for (let j=i+1;j<arr.length;j++){
                if(arr[i]==arr(j)){
                    duplicate[duplicate.length]=arr[i]
                    Break;
                }
            }
        }
        console.log(duplicate)
        
       
    </script>
