<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output Methods</title>
</head>
<body>
   
    <p id="demo"></p>

    <script>
        // 1. Using innerHTML
        document.getElementById("demo").innerHTML = "Output using innerHTML"

        // 2. Using document.write()
        document.write("<p>Output using document.write()</p>")

        // 3. Using window.alert()
        console.log("Output using alert box")

        // 4. Using console.log()
        console.log("Output using console.log()")

        // 5. Using window.print()
        // Uncomment the line below to open the print dialog
        // window.print();
    </script>

</body>
</html>
