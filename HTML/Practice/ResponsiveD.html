<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
        }
        .mainDiv{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 15px 20px;
        }
        #nav{
            display: flex;
            gap: 20%;
        }
        #ham span{
            height: 3px;
            width: 25px;
            background-color: white;
            display: block;
            margin: 6px 0;
            cursor: pointer;
        }
        #ham{
            display: none;
        }
        #ham.active span:nth-child(1){
            transform: rotate(45deg) translate(5px,5px);
        }
        #ham.active span:nth-child(2){
            opacity: 0;
        }
        #ham.active span:nth-child(3){
            transform: rotate(-45deg) translate(5px,-5px);
        }
        .nav:hover{
            cursor: pointer;
            color: blue;
        }
        @media (max-width:768px) and (orientation: portrait){
            #nav{
                flex-direction: column;
                display: none;
                position: absolute;
                top: 60px;
                width: 50%;
                right: 0;
                text-align: center;
                background-color: #333;
                margin-top: 5px;
            }
            #nav.active{
                display: flex;
            }
            #login{
                display: none;
            }
            #ham{
                display: block;
            }
        }

    </style>
</head>
<body>
    <div class="mainDiv">
        <div class="logo">logo</div>
        <div id="nav">
            <div class="nav">Home</div>
            <div class="nav">Services</div>
            <div class="nav">About</div>
            <div class="nav">Contact</div>
        </div>
        <button id="login">Login</button>
        <div id="ham" onclick="toggle()">
            <span></span><span></span><span></span>
        </div>
    </div>
    <script>
        function toggle(){
            document.getElementById('nav').classList.toggle('active')
            document.getElementById('ham').classList.toggle('active')
        }
    </script>
</body>
</html>
