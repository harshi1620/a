<!DOCTYPE html>
<html>
<body>

<script>
let numbers = [10, 20, 30, 40, 50]

document.write("Before: " + numbers + "<br>")

numbers.splice(0, numbers.length)

document.write("After: " + numbers)





let fruits = ["Apple", "Banana", "Orange"]

document.write("Before: " + fruits + "<br>")

fruits.length = 0

document.write("After: " + fruits)
</script>

</body>
</html>
