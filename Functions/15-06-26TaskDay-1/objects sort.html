<!DOCTYPE html>
<html>
<body>


<button onclick="showPerson()">Show Person</button>

<p id="output"></p>

<script>
function showPerson() {
    const person = {
        name: "Sam",
        age: 25,
        city: "Mumbai"
    };

    document.getElementById("output").innerHTML =
        `Name: ${person.name}<br>
         Age: ${person.age}<br>
         City: ${person.city}`
}
</script>

</body>
</html>
