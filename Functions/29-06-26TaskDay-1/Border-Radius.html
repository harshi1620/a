<!DOCTYPE html>
<html>
<head>
    <title>Border Radius Example</title>
    <style>
        .box1 {
    border: 2px solid gray;
    border-radius: 5px;
    padding: 10px;
    width: 200px;
}

.box2 {
    border: 2px solid gray;
    border-radius: 15px;
    padding: 10px;
    width: 200px;
}

.box3 {
    border: 2px solid gray;
    border-radius: 25px;
    padding: 10px;
    width: 200px;
}

.circle {
    width: 100px;
    height: 100px;
    background-color:black;
    border-radius: 50%;
    text-align: center;
    line-height: 100px;
    color: white;
}
    </style>
    
</head>
<body>

    <h2>Border Radius </h2>

    <p class="box1">5px Rounded Corners</p>

    <p class="box2">15px Rounded Corners</p>

    <p class="box3">25px Rounded Corners</p>

    <p class="circle">Circle</p>

</body>
</html>
