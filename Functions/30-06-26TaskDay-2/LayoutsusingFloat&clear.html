<!DOCTYPE html>
<html>
<head>
    <title>Float and Clear</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .left {
            float: left;
            width: 200px;
            height: 100px;
            background-color: lightblue;
            text-align: center;
            line-height: 100px;
            margin-right: 20px;
        }

        .right {
            float: right;
            width: 200px;
            height: 100px;
            background-color: lightgreen;
            text-align: center;
            line-height: 100px;
        }

        .clear {
            clear: both;
            background-color: lightcoral;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2> Float and Clear </h2>

    <div class="left">Float Left</div>

    <div class="right">Float Right</div>


</body>
</html>
