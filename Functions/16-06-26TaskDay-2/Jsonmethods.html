<!DOCTYPE html>
<html>
<head>
    <title>Deep Copy Using JSON</title>
</head>
<body>
<pre id="output"></pre>

<script>
let result = ""

// Original Object
const student1 = {
    name: "Harshi",
    age: 20,
    address: {
        city: "Chennai",
        state: "Tamil Nadu"
    }
}

// Deep Copy using JSON methods
const student2 = JSON.parse(JSON.stringify(student1))

// Modify copied object
student2.name = "Kumari"
student2.address.city = "Madurai"

// Display results
result += "Original Object:\n"
result += JSON.stringify(student1, null, 2) + "\n\n"

result += "Copied Object:\n"
result += JSON.stringify(student2, null, 2)

document.getElementById("output").textContent = result
</script>

</body>
</html>
