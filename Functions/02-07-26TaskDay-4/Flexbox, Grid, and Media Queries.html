<!DOCTYPE html>
<html>
<head>
    <title>Responsive Layout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Flexbox Navigation */
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        /* Grid Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            background: lightblue;
            padding: 20px;
            text-align: center;
        }

        img {
            width: 100%;
            height: auto;
        }

        /* Mobile */
        @media (max-width: 767px) {
            nav {
                flex-direction: column;
                align-items: center;
            }

            .container {
                grid-template-columns: 1fr;
            }

            body {
                font-size: 16px;
            }
        }

        /* Tablet */
        @media (min-width: 768px) and (max-width: 1023px) {
            body {
                font-size: 18px;
            }
        }

        /* Desktop */
        @media (min-width: 1024px) {
            body {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <h1 align="center">Responsive Webpage</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <div class="box">
            <h3>Sidebar</h3>
            <p>Uses CSS Grid.</p>
        </div>

        <div class="box">
            <h3>Main Content</h3>
            <p>Responsive using Flexbox, Grid, and Media Queries.</p>
            <!-- <img src="https://picsum.photos/400/200" alt="Sample Image">    -->
        </div>
    </div>

</body>
</html>
