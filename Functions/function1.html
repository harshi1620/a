<!-- Named function:-- -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // three types of functions
        // 1) named function
        // 2) anonymous function
        // 3) arrow function 
        // Named function  
        function a(){
            //block of code (implementation)
        } //function declaration
        a() //function calling
        //anonymous function
        // (function (){

        // })
        //arrow function
        let add = (a,b)=>{
            return a+b
        }
        console.log(add(5,2))
    </script>
</body>
</html>
