<!DOCTYPE html>
<html>
<head>
    <title>Responsive Flexbox + Grid Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Grid Layout */
        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            grid-template-columns: 1fr 3fr;
            min-height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        header {
            grid-area: header;
            background: whitesmoke;
            text-align: center;
            padding: 20px;
        }

        aside {
            grid-area: sidebar;
            background: #f4f4f4;
            padding: 20px;
        }

        main {
            grid-area: main;
            background: #ffffff;
            padding: 20px;
        }

        footer {
            grid-area: footer;
            /* background: #333; */
            color: black;
            border:solid black 1px ;
            text-align: center;
            padding: 15px;
        }

        /* Flexbox for Cards */
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card {
            flex: 1 1 200px;
            /* background: lightblue; */
            border: 2px solid navy;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            .container {
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <header>
        <h2>My Responsive Webpage</h2>
    </header>

    <aside>
        <h3>Sidebar</h3>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </aside>

    <main>
        <h2>Our Services</h2>
        <div class="cards">
            <div class="card">Service 1</div>
            <div class="card">Service 2</div>
            <div class="card">Service 3</div>
            <div class="card">Service 4</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</div>

</body>
</html>
