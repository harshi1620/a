<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Methods of CSS</title>

    <!-- Internal CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h2 {
            color: blue;
        }

        .external {
            color: green;
            font-size: 20px;
            border: 2px solid green;
            padding: 10px;
            margin: 20px;
        }
    </style>

    
</head>
<body>

    <h1>Three Methods of Applying CSS</h1>

    <!-- Inline CSS -->
    <p style="color:rgb(194, 145, 128); font-size:18px;">
        This paragraph uses <b>Inline CSS</b>.
    </p>

    <!-- Internal CSS -->
    <h2>This heading uses Internal CSS.</h2>

    <!-- External CSS -->
    <div class="external">
        This section uses External CSS.
    </div>

</body>
</html>
