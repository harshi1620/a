<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h2>Even or Odd</h2>
<p id="result"></p>

<script>
    let number = 2;
    let result = (number % 2 === 0) ? "Even" : "Odd";

    document.getElementById("result").innerHTML = result;
</script>

</body>
</html>
