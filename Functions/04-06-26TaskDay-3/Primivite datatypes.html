<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // String:--
    let name = "Harshitha"
    let greeting = 'Hello'
    let message = `Hi ${name}`

    console.log(name)
    console.log(greeting)
    console.log(message)

    // Number:--
    let age = 21
    let price = 199.99

    console.log(age)
    console.log(price)
    console.log(age + 5)

    // Boolean:--
    let isLoggedIn = true
    let isAdmin = false

    console.log(isLoggedIn)
    console.log(isAdmin)

    // undefined:--
    let score
    console.log(score)
    console.log(typeof score)

    // Null:--
    let selectedUser = null

    console.log(selectedUser)
    </script>
    
</body>
</html>
