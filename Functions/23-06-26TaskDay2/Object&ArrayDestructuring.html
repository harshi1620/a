<!DOCTYPE html>
<html>
<head>
    <title>Destructuring Example</title>
</head>
<body>
<script>
    // Object Destructuring
    const student = {
        name: "Sam",
        age: 20,
        Place: "Hyd"
    }

    const { name, age, Place } = student

    console.log("Object Destructuring:")
    console.log(name)
    console.log(age)
    console.log(Place)

    // Array Destructuring
    const colors = ["Pink", "Red", "skyBlue"]

    const [first, second, third] = colors

    console.log("Array Destructuring:")
    console.log(first)
    console.log(second)
    console.log(third)
</script>

</body>
</html>
