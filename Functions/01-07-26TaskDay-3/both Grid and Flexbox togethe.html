<!DOCTYPE html>
<html>
<head>
    <title>Grid + Flexbox </title>
   <style>
    
.container {
    display: grid;
    grid-template-columns: 200px 1fr;
    grid-template-rows: 70px auto 60px;
    gap: 10px;
    height: 100vh;
}

header {
    grid-column: 1 / 3;
    background: #4CAF50;
    color: white;
    text-align: center;
    padding: 20px;
}

aside {
    background: #ddd;
    padding: 20px;
}

main {
    display: flex;         
    gap: 20px;
    justify-content: space-around;
    align-items: center;
    background: #f5f5f5;
    padding: 20px;
}

.card {
    width: 150px;
    height: 150px;
    background: white;
    border: 1px solid #ccc;

    display: flex;          /* Flexbox inside each card */
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
}

footer {
    grid-column: 1 / 3;
    background: #333;
    color: white;
    text-align: center;
    padding: 20px;
}  
   </style>
</head>
<body>

<div class="container">
    <header>Header</header>

    <aside>Sidebar</aside>

    <main>
        <div class="card">
            <h3>Card 1</h3>
            <button>Read More</button>
        </div>

        <div class="card">
            <h3>Card 2</h3>
            <button>Read More</button>
        </div>

        <div class="card">
            <h3>Card 3</h3>
            <button>Read More</button>
        </div>
    </main>

    <footer>Footer</footer>
</div>

</body>
</html>
