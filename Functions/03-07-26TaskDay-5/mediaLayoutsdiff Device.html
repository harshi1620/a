<!DOCTYPE html>
<html>
<head>
    <title>Media Query Example</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
        }

        h1{
            text-align:center;
            padding:20px;
        }

        /* Desktop Layout */
        .container{
            display:flex;
            justify-content:space-around;
            padding:20px;
        }

        .box{
            width:30%;
            background:skyblue;
            padding:20px;
            text-align:center;
            border-radius:10px;
        }

        /* Tablet Layout */
        @media (max-width:768px){
            .container{
                flex-wrap:wrap;
            }

            .box{
                width:45%;
                margin-bottom:15px;
                background:lightgreen;
            }
        }

        /* Mobile Layout */
        @media (max-width:480px){
            .container{
                flex-direction:column;
                align-items:center;
            }

            .box{
                width:90%;
                background:lightcoral;
            }

            h1{
                font-size:24px;
            }
        }
    </style>
</head>

<body>

<h1>Responsive Webpage</h1>

<div class="container">

    <div class="box">
        <h2>HTML</h2>
        <p>Structure of a webpage.</p>
    </div>

    <div class="box">
        <h2>CSS</h2>
        <p>Styles the webpage.</p>
    </div>

    <div class="box">
        <h2>JavaScript</h2>
        <p>Adds interactivity.</p>
    </div>

</div>

</body>
</html>
