<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background: gray;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 20px 30px 40px 150px 20px;
            gap: 5px;
        }
        .section{
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
        }
        #item1,#item2,#item3,#item7{
            grid-column: 1/-1;
        }
        #item1{
            display: flex;
            justify-content: space-between;
            padding: 10px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section" id="item1">
            <div>Logo</div>
            <div>Navigation</div>
        </div>
        <div class="section" id="item2">Header</div>
        <div class="section" id="item3">Intro </div>
        <div class="section" id="item4">Box1  </div>
        <div class="section" id="item5">Box2</div>
        <div class="section" id="item6">Box3</div>
        <div class="section" id="item7">Footer</div>
    </div>
</body>
</html>
