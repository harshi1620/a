<!DOCTYPE html>
<html>
<head>
    <title>Try-Catch with Async/Await</title>
</head>
<body>
<script>
    function getData() {
        return new Promise((resolve, reject) => {
            let success = false // Change to true or false

            setTimeout(() => {
                if (success) {
                    resolve("Data fetched successfully!")
                } else {
                    reject("Error: Failed to fetch data.")
                }
            }, 1000)
        })
    }

    async function fetchData() {
        try {
            const result = await getData()
            console.log(result)
        } catch (error) {
            console.log(error)
        }
    }

    fetchData()
</script>

</body>
</html>
