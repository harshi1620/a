<!DOCTYPE html>
<html>
<head>
  <title>Simple Dashboard</title>
  <style>
    body {
  margin: 0;
  font-family: Arial, sans-serif;
}

.container {
  display: grid;
  grid-template-areas:
    "header header"
    "sidebar main"
    "footer footer";
  grid-template-columns: 200px 1fr;
  min-height: 100vh;
  border: black solid 1px;
}

header {
  grid-area: header;
  /* background: #4CAF50; */
  color: black;
  padding: 15px;
  border: 1px solid black;
}

aside {
  grid-area: sidebar;
  background: #ddd;
  padding: 15px;
  border: black solid 1px;
}

main {
  grid-area: main;
  background: #f4f4f4;
  padding: 15px;
}

footer {
  grid-area: footer;
  /* background: #4CAF50; */
  color:black;
  padding: 15px;
  text-align: center;
  border: black solid 1px;
}

/* Responsive */
@media (max-width: 600px) {
  .container {
    grid-template-areas:
      "header"
      "sidebar"
      "main"
      "footer";
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>

<div class="container">
  <header>Header</header>
  <aside>Sidebar</aside>
  <main>Main Content</main>
  <footer>Footer</footer>
</div>

</body>
</html>
