<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Example</title>
    <style>
        .container {
            display: grid;

            /* 3 Columns */
            grid-template-columns: 100px 100px 100px;

            /* 3 Rows */
            grid-template-rows: 100px 100px 100px;

            /* Space between boxes */
            gap: 10px;

            /* Center items horizontally and vertically */
            justify-items: center;
            align-items: center;

            /* Shortcut for justify-items + align-items */
            place-items: center;

            background: lightgray;
            padding: 10px;
            width: 340px;
        }

        .box {
            background: royalblue;
            color: white;
            width: 60px;
            height: 60px;
            text-align: center;
            line-height: 60px;
            font-size: 20px;
        }

        /* Span across 2 columns */
        .box1 {
            grid-column: 1 / 3;
        }

        /* Span across 2 rows */
        .box2 {
            grid-row: 1 / 3;
        }
    </style>
</head>
<body>

<h2>CSS Grid Properties</h2>

<div class="container">
    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
</div>

</body>
</html>
