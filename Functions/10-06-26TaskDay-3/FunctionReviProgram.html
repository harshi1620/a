<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<button onclick="showResult()">Run Program</button>

<p id="result"></p>

<script>
    // Recursive Function
    function sumRecursive(n) {
        if (n === 1)
            return 1
        return n + sumRecursive(n - 1)
    }

    // Iterative Function
    function sumIterative(n) {
        let sum = 0
        for (let i = 1; i <= n; i++) {
            sum += i
        }
        return sum
    }

    function showResult() {
        let n = 5

        document.getElementById("result").innerHTML =
            "Recursive Sum = " + sumRecursive(n) + "<br>" +
            "Iterative Sum = " + sumIterative(n)
    }
</script>

</body>
</html>
