<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 'harshitha'
        let result=''
        for(let i=0; i<a.length; i++){
            let isFound = false
            for(let j=0; j<i; j++){
                if(a[j]==a[i]){
                    isFound=true
                    break
                }
            }
            if(!isFound){
                result=result+a[i]
            }
        }
        console.log(result)
    </script>
</body>
</html>
