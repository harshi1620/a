<!DOCTYPE html>
<html>
<head>
    <title>Borders</title>
    <style>
        /* Solid Border */
.solid {
    border: 2px solid black;
    padding: 10px;
}

/* Dashed Border */
.dashed {
    border: 3px dashed grey;
    padding: 10px;
}

/* Dotted Border */
.dotted {
    border: 2px dotted black;
    padding: 10px;
}

/* Double Border */
.double {
    border: 5px double grey;
    padding: 10px;
}

/* Groove Border */
.groove {
    border: 6px groove black;
    padding: 10px;
}
    </style>
    
    </head>
<body>

    <h2>Border Styles </h2>

    <p class="solid">Solid Border</p>

    <p class="dashed">Dashed Border</p>

    <p class="dotted">Dotted Border</p>

    <p class="double">Double Border</p>

    <p class="groove">Groove Border</p>

</body>
</html>
