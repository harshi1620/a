<!DOCTYPE html>
<html>
<body>

<h2>Combine Arrays</h2>

<script>
    let arr1 = [1, 2, 3]
    let arr2 = [4, 5, 6]

    // Using concat()
    let result1 = arr1.concat(arr2)
    document.write("Using concat(): " + result1 + "<br>")

    // Using spread operator
    let result2 = [...arr1, ...arr2]
    document.write("Using spread (...): " + result2)
</script>

</body>
</html>
