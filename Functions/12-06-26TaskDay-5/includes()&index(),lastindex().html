<!DOCTYPE html>
<html>
<body>

<h2>Search Elements in Array</h2>

<script>
    let Names = ["Harshi", "Sam", "Ben", "surya", "naga"]

    document.write("Array: " + Names + "<br><br>")

    // Check if element exists
    document.write("Includes surya: " + Names.includes("surya") + "<br>")

    // Find first position
    document.write("First index of Ben: " + Names.indexOf("Ben") + "<br>")

    // Find last position
    document.write("Last index of Ben: " + Names.lastIndexOf("Ben"))
</script>

</body>
</html>
