<!DOCTYPE html>
<html>
<head>
    <title>Date Object Methods</title>
</head>
<body>

    <h2>JavaScript Date Object Methods</h2>
    <div id="output"></div>

    <script>
        const date = new Date()

        let result = ""

        result += "<b>Current Date:</b> " + date + "<br><br>"

        result += "getFullYear(): " + date.getFullYear() + "<br>"
        result += "getMonth(): " + date.getMonth() + " (0 = January)<br>"
        result += "getDate(): " + date.getDate() + "<br>"
        result += "getDay(): " + date.getDay() + " (0 = Sunday)<br>"
        result += "getHours(): " + date.getHours() + "<br>"
        result += "getMinutes(): " + date.getMinutes() + "<br>"
        result += "getSeconds(): " + date.getSeconds() + "<br>"
        result += "getMilliseconds(): " + date.getMilliseconds() + "<br>"

        document.getElementById("output").innerHTML = result
    </script>

</body>
</html>
