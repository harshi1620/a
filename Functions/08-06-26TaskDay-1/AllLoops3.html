<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h2>JavaScript Loop Examples</h2>
<div id="output"></div>

<script>
let result = ""

// 1. FOR LOOP:--

result += "<h3>For Loop</h3>"
for(let i = 1; i <= 3; i++){
    result += "Number: " + i + "<br>"
}


// 2. WHILE LOOP:--

result += "<h3>While Loop</h3>"

let count = 2
while(count > 0){
    result += "Countdown: " + count + "<br>"
    count--
}


// 3. DO-WHILE LOOP:--

result += "<h3>Do While Loop</h3>"

let attempts = 1

do{
    result += "Login attempt: " + attempts + "<br>"
    attempts++
}
while(attempts <= 3)


// 4. FOR...OF LOOP:--

result += "<h3>For...Of Loop</h3>"

let students = ["John", "Priya", "Rahul", "Sara"]

for(let student of students){
    result += "Student: " + student + "<br>"
}


// 5. FOR...IN LOOP:--

result += "<h3>For...In Loop</h3>"

let employee = {
    Name: "Harshitha",
    Age: 20,
    Department: "IT"
};

for(let key in employee){
    result += key + ": " + employee[key] + "<br>"
}

document.getElementById("output").innerHTML = result

</script>

</body>
</html>
