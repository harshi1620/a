<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding and Margin</title>

    <style>
        body {
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .box {
            width: 250px;
            background-color:bisque;
            border: 1px solid black;
            text-align: center;
            
        }

        /* Different Padding Examples */
        .padding1 {
            padding: 10px;
        }

        .padding2 {
            padding: 20px 40px;
        }

        .padding3 {
            padding: 10px 20px 30px 40px;
        }

        /* Different Margin Examples */
        .margin1 {
            margin: 20px;
        }

        .margin2 {
            margin: 30px 60px;
        }

        .margin3 {
            margin: 10px 20px 30px 40px;
        }
    </style>
</head>
<body>
    <h2>Padding</h2>

    <div class="box padding1">
        Padding: 10px
    </div>

    <div class="box padding2">
        Padding: 20px 40px
    </div>

    <div class="box padding3">
        Padding: 10px 20px 30px 40px
    </div>

    <hr>

    <h2>Margin</h2>

    <div class="box margin1">
        Margin: 20px
    </div>

    <div class="box margin2">
        Margin: 30px 60px
    </div>

    <div class="box margin3">
        Margin: 10px 20px 30px 40px
    </div>

</body>
</html>
