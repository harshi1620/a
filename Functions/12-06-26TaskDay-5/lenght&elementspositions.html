<!DOCTYPE html>
<html>
<body>

<h2>Array Length and Position</h2>

<script>
    let colors = ["red", "pink", "blue", "Orange"]

    // Find array length
    document.write("Array Length: " + colors.length + "<br>")

    // Find position of an element
    document.write("Position of blue: " + colors.indexOf("blue"))
</script>

</body>
</html>
