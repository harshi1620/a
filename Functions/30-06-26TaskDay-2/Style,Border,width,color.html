<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Styles</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .box {
            width: 300px;
            padding: 20px;
            margin: 15px auto;
            background-color: white;
            text-align: center;
            font-weight: bold;
        }

        /* Different Border Styles */
        .solid {
            border: 3px solid black;
        }

        .dashed {
            border: 4px dashed gray;
        }

        .dotted {
            border: 5px dotted black;
        }

        .double {
            border: 6px double gray;
        }

        .groove {
            border: 8px groove black;
        }

        .ridge {
            border: 8px ridge gray;
        }

        .inset {
            border: 6px inset black;
        }

        .outset {
            border: 6px outset grey;
        }
    </style>
</head>
<body>

    <h1> Border Styles, Widths, and Colors</h1>

    <div class="box solid">Solid Border </div>

    <div class="box dashed">Dashed Border</div>

    <div class="box dotted">Dotted Border </div>

    <div class="box double">Double Border</div>

    <div class="box groove">Groove Border</div>

    <div class="box ridge">Ridge Border</div>

    <div class="box inset">Inset Border</div>

    <div class="box outset">Outset Border</div>

</body>
</html>
