<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="doIt()">Click</button>
    <script>
        function doIt(){
            let arr = [10,20,5,8,30]        
        for(let i=0; i<arr.length; i++){
            let count = 0
            for(let j=0; j<arr.length; j++){
                if(arr[j]>arr[i]){
                    count++
                }
            }
            if(count==0){
                console.log(arr[i])
            }
        }
        }        
    </script>
</body>
