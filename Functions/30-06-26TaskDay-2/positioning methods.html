<!DOCTYPE html>
<html>
<head>
    <title>CSS Position </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            height: 1200px; /* For scrolling */
        }

        .box {
            width: 150px;
            height: 60px;
            color: black;
            text-align: center;
            line-height: 60px;
            margin: 20px;
        }

        /* Static */
        .static {
            position: static;
            background: skyblue;
        }

        /* Relative */
        .relative {
            position: relative;
            left: 40px;
            background:skyblue;
        }

        /* Absolute */
        .parent {
            position: relative;
            width: 300px;
            height: 150px;
            border: 2px solid black;
            margin: 20px;
        }

        .absolute {
            position: absolute;
            top: 20px;
            right: 20px;
            background: skyblue;
        }

        /* Fixed */
        .fixed {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background:skyblue;
        }

        /* Sticky */
        .sticky {
            position: sticky;
            top: 0;
            /* background: skyblue; */
            padding: 10px;
            text-align: center;
            color: black;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>CSS Position </h2>

    <!-- <div class="sticky">Sticky Header (Scroll Down)</div> -->

    <div class="box static">Static</div>

    <div class="box relative">Relative</div>

    <div class="parent">
        Parent Box
        <div class="box absolute">Absolute</div>
    </div>

    <div class="box fixed">Fixed</div>

    

</body>
</html>
