<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Grid Container */
        .container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: 80px 300px 80px;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 10px;
            padding: 10px;
        }

        /* Grid Items */
        .header {
            grid-area: header;
            /* background: lightblue; */
            text-align: center;
            padding: 25px;
            border: solid black 1px;
        }

        .sidebar {
            grid-area: sidebar;
            /* background: lightgreen; */
            text-align: center;
            padding: 20px;
            border: solid black 1px;
        }

        .main {
            grid-area: main;
            /* background: lightyellow; */
            text-align: center;
            padding: 20px;
            border: solid black 1px;
        }

        .footer {
            grid-area: footer;
            /* background: lightcoral; */
            text-align: center;
            padding: 25px;
            border: solid black 1px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h2>Header</h2>
    </div>

    <div class="sidebar">
        <h3>Sidebar</h3>
        <p>Navigation Menu</p>
    </div>

    <div class="main">
        <h3>Main Content</h3>
       
    </div>

    <div class="footer">
        <h3>Footer</h3>
    </div>

</div>

</body>
</html>
